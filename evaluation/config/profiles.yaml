# Learner Profiles Configuration
# Preserved version-controlled configurations for milestone acceptance tests and comparative evaluation.

version: "1.0"
description: "Standard evaluation learner profiles encoding daily time budgets, initial states, and target test cases."

profiles:
  profile_1:
    id: "profile_1"
    name: "Beginner (High Time Constraint)"
    description: "Complete novice — latent mastery approaches 0 for all foundational nodes."
    daily_budget_minutes: 5
    initial_mastery_default: 0.01
    initial_uncertainty_default: 0.25
    target_tc_ids:
      - "TC-3.1"
      - "TC-6.2"

  profile_2:
    id: "profile_2"
    name: "Intermediate (Moderate Time Constraint)"
    description: "Partial foundational mastery — diagnostic flags prerequisite nodes as Mastered but downstream nodes as Developing or Uncertain."
    daily_budget_minutes: 10
    initial_mastery_prerequisites: 0.90
    initial_mastery_downstream: 0.30
    target_tc_ids:
      - "TC-2.1"
      - "TC-2.2"

  profile_3:
    id: "profile_3"
    name: "Advanced / Refresher (Flexible Time)"
    description: "Historical mastery of full curriculum with significant elapsed time since last review."
    daily_budget_minutes: 15
    initial_mastery_default: 0.92
    elapsed_days_since_review: 45
    target_tc_ids:
      - "TC-5.2"

  profile_4:
    id: "profile_4"
    name: "Mixed Knowledge (High Capacity)"
    description: "Sporadic knowledge gaps — high mastery in advanced topics, foundational gaps triggering Uncertain state."
    daily_budget_minutes: 30
    initial_mastery_advanced: 0.88
    foundational_uncertain_nodes: ["concept_b1", "concept_b2"]
    target_tc_ids:
      - "TC-5.1"
      - "TC-7.1"
      - "TC-7.2"
