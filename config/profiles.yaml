# Learner Profiles Configuration
# Preserved version-controlled configurations for milestone acceptance tests and comparative evaluation.

version: "2.0"
description: "Standard evaluation learner profiles encoding daily time budgets and (p, kappa, n) initial concept state parameters."

profiles:
  profile_1:
    id: "profile_1"
    name: "Beginner (High Time Constraint)"
    description: "Complete novice — low initial mastery, unprobed state."
    daily_budget_minutes: 5
    initial_states:
      default:
        p: 0.01
        kappa: 2.0
        n: 0
    target_tc_ids:
      - "TC-3.1"
      - "TC-6.2"

  profile_2:
    id: "profile_2"
    name: "Intermediate (Moderate Time Constraint)"
    description: "Partial foundational mastery — prerequisites probed and mastered, downstream unprobed."
    daily_budget_minutes: 10
    initial_states:
      prerequisites:
        p: 0.90
        kappa: 10.0
        n: 8
      downstream:
        p: 0.30
        kappa: 2.0
        n: 0
    target_tc_ids:
      - "TC-2.1"
      - "TC-2.2"

  profile_3:
    id: "profile_3"
    name: "Advanced / Refresher (Flexible Time)"
    description: "Historical mastery of full curriculum with probed prior mastery."
    daily_budget_minutes: 15
    initial_states:
      default:
        p: 0.92
        kappa: 8.0
        n: 6
    elapsed_days_since_review: 45
    target_tc_ids:
      - "TC-5.2"

  profile_4:
    id: "profile_4"
    name: "Mixed Knowledge (High Capacity)"
    description: "Sporadic knowledge gaps — high mastery in advanced topics, unprobed foundational gaps."
    daily_budget_minutes: 30
    initial_states:
      advanced:
        p: 0.88
        kappa: 10.0
        n: 8
      foundational:
        p: 0.50
        kappa: 2.0
        n: 0
    foundational_uncertain_nodes: ["concept_b1", "concept_b2"]
    target_tc_ids:
      - "TC-5.1"
      - "TC-7.1"
      - "TC-7.2"
