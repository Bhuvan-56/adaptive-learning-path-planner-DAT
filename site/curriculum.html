<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Graph</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
</head>
<body>
<main>
  <h1>Curriculum graph</h1>
  <p class="lede">The demo curriculum has four concepts. An arrow means "is a prerequisite of": the planner never places a
    concept on a day before all of its prerequisites are mastered or already planned.</p>
  <div class="card"><div id="graph"><p class="small">Loading…</p></div><div id="graph-src"></div></div>
  <h2>Concepts</h2>
  <div class="table-wrap card" id="nodes"></div>
  <h2>Prerequisite edges</h2>
  <div class="table-wrap card" id="edges"></div>
</main>
<script>
const PATH = "data/curricula/demo_curriculum.json";
(async () => {
  const gEl = document.getElementById("graph");
  let data;
  try { data = await Site.getJSON("../" + PATH); } catch (e) { return Site.fail(gEl, e); }
  const nodes = data.nodes, edges = data.edges;
  // layer = longest path from a root
  const depth = {};
  nodes.forEach(n => depth[n.node_id] = 0);
  for (let i = 0; i < nodes.length; i++)
    edges.forEach(e => { depth[e.target] = Math.max(depth[e.target], depth[e.source] + 1); });
  const layers = {};
  nodes.forEach(n => (layers[depth[n.node_id]] ||= []).push(n));
  const L = Math.max(...Object.values(depth)) + 1;
  const W = 640, H = 120 + 120 * (L - 1), BW = 150, BH = 56;
  const pos = {};
  Object.entries(layers).forEach(([d, ns]) => ns.forEach((n, i) => {
    pos[n.node_id] = { x: W * (i + 1) / (ns.length + 1), y: 50 + 120 * d };
  }));
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curriculum prerequisite graph">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--text-2)"/></marker></defs>`;
  edges.forEach(e => {
    const a = pos[e.source], b = pos[e.target];
    const y1 = a.y + BH / 2, y2 = b.y - BH / 2 - 3;
    const mx = (a.x + b.x) / 2, my = (y1 + y2) / 2;
    svg += `<line x1="${a.x}" y1="${y1}" x2="${b.x}" y2="${y2}" stroke="var(--text-2)" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="${mx + (mx >= W / 2 ? 18 : -18)}" y="${my}" text-anchor="${mx >= W / 2 ? "start" : "end"}">importance ${e.importance}</text>`;
  });
  nodes.forEach(n => {
    const p = pos[n.node_id];
    svg += `<g data-tip="<b>${Site.esc(n.node_id)}: ${Site.esc(n.concept_name)}</b><br>${n.baseline_duration} min, difficulty ${n.base_difficulty}<br>exercises: ${n.exercises.join(", ")}">
      <rect x="${p.x - BW / 2}" y="${p.y - BH / 2}" width="${BW}" height="${BH}" rx="8" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="${p.x}" y="${p.y - 4}" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--text)">${Site.esc(n.node_id)} · ${Site.esc(n.concept_name)}</text>
      <text x="${p.x}" y="${p.y + 15}" text-anchor="middle">${n.baseline_duration} min</text></g>`;
  });
  gEl.innerHTML = svg + "</svg>";
  document.getElementById("graph-src").innerHTML = Site.src(PATH);
  Site.bindTips(gEl);

  const pre = id => edges.filter(e => e.target === id).map(e => e.source).join(", ") || "none";
  document.getElementById("nodes").innerHTML = `<table><thead><tr><th>Node</th><th>Concept</th><th class="num">Minutes</th>
    <th class="num">Base difficulty</th><th>Exercises</th><th>Prerequisites</th></tr></thead><tbody>${
    nodes.map(n => `<tr><td><b>${n.node_id}</b></td><td>${Site.esc(n.concept_name)}</td><td class="num">${n.baseline_duration}</td>
      <td class="num">${n.base_difficulty.toFixed(2)}</td><td><code>${n.exercises.join(", ")}</code></td><td>${pre(n.node_id)}</td></tr>`).join("")
    }</tbody></table>${Site.src(PATH)}`;
  document.getElementById("edges").innerHTML = `<table><thead><tr><th>Prerequisite</th><th>Unlocks</th><th class="num">Importance</th></tr></thead><tbody>${
    edges.map(e => `<tr><td>${e.source}</td><td>${e.target}</td><td class="num">${e.importance}</td></tr>`).join("")
    }</tbody></table>${Site.src(PATH)}`;
})();
</script>
</body>
</html>
